<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Planificador de Viajes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-cargada pagina-auth">

    <main class="contenedor-auth">
        <section class="tarjeta-auth">

            <div class="cabecera-auth">
                <div class="icono-auth">🧳</div>
                <h1>Crear cuenta</h1>
                <p>Crea tu cuenta y empieza a preparar tu próxima aventura.</p>
            </div>

            <form id="formulario-signup" class="form-auth">
                <div class="mb-3">
                    <label for="nombre-signup" class="form-label">Nombre</label>
                    <input type="text" id="nombre-signup" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email-signup" class="form-label">Email</label>
                    <input type="email" id="email-signup" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="password-signup" class="form-label">Contraseña</label>
                    <input type="password" id="password-signup" class="form-control" required>
                </div>

                <button type="submit" class="btn boton-auth w-100">Registrarme</button>

                <p id="mensaje-signup" class="mt-3 text-center"></p>
            </form>

            <div class="enlaces-auth">
                <p>
                    ¿Ya tienes cuenta?
                    <a href="login.html">Inicia sesión</a>
                </p>

                <a href="index.html" class="volver-inicio">← Volver al inicio</a>
            </div>

        </section>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        const formularioSignup = document.getElementById("formulario-signup");
        const mensajeSignup = document.getElementById("mensaje-signup");

        formularioSignup.addEventListener("submit", async function(evento) {
            evento.preventDefault();

            const nombre = document.getElementById("nombre-signup").value;
            const email = document.getElementById("email-signup").value;
            const password = document.getElementById("password-signup").value;

            const resultado = await auth.signup(nombre, email, password);

            if (resultado.respuesta.ok) {
                mensajeSignup.textContent = "Usuario registrado correctamente";
                mensajeSignup.className = "mt-3 text-center text-success";

                setTimeout(function() {
                    window.location.href = "login.html";
                }, 1000);
            } else {
                mensajeSignup.textContent = resultado.datos.error;
                mensajeSignup.className = "mt-3 text-center text-danger";
            }
        });
    </script>

</body>
</body>
</html>
