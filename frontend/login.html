<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Planificador de Viajes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-cargada pagina-auth">

    <main class="contenedor-auth">
        <section class="tarjeta-auth">

            <div class="cabecera-auth">
                <div class="icono-auth">✈️</div>
                <h1>Iniciar sesión</h1>
                <p>Accede a tu cuenta y sigue organizando tus viajes.</p>
            </div>

            <form id="formulario-login" class="form-auth">
                <div class="mb-3">
                    <label for="email-login" class="form-label">Email</label>
                    <input type="email" id="email-login" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="password-login" class="form-label">Contraseña</label>
                    <input type="password" id="password-login" class="form-control" required>
                </div>

                <button type="submit" class="btn boton-auth w-100">Entrar</button>

                <p id="mensaje-login" class="mt-3 text-center"></p>
            </form>

            <div class="enlaces-auth">
                <p>
                    ¿No tienes cuenta?
                    <a href="signup.html">Regístrate</a>
                </p>

                <a href="index.html" class="volver-inicio">← Volver al inicio</a>
            </div>

        </section>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        const formularioLogin = document.getElementById("formulario-login");
        const mensajeLogin = document.getElementById("mensaje-login");

        formularioLogin.addEventListener("submit", async function(evento) {
            evento.preventDefault();

            const email = document.getElementById("email-login").value;
            const password = document.getElementById("password-login").value;

            const resultado = await auth.login(email, password);

            if (resultado.respuesta.ok) {
                mensajeLogin.textContent = "Login correcto";
                mensajeLogin.className = "mt-3 text-center text-success";

                window.location.href = "viajes.html";
            } else {
                mensajeLogin.textContent = resultado.datos.error;
                mensajeLogin.className = "mt-3 text-center text-danger";
            }
        });
    </script>

</body>
</html>
